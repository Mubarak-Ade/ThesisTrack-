# ThesisTrack web — nginx site config (spec §18.3, plan 15.2)
#
# Serves the vite build with the SPA fallback and proxies /api to the api
# service. Same-origin in production: the browser only ever talks to this
# host, so the HTTP-only refresh cookie (path-scoped to /api/v1/auth) is
# sent without any CORS ceremony.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the bundles
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → api container. No trailing slash on proxy_pass, so the original
    # request URI (/api/v1/…) is forwarded unchanged.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The entry document must never be cached (hashed assets below may be).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable; everything else falls through to the
    # SPA fallback — deep links like /proposals/<id> serve index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
